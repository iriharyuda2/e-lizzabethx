<textarea id="in" rows="6" placeholder="Type text..."></textarea>
<button onclick="r()">Reverse</button>
<textarea id="out" rows="6" readonly></textarea>
<h2>How to Use</h2><p>Type text, click Reverse.</p>
<script>function r(){document.getElementById('out').value=[...document.getElementById('in').value].reverse().join('');}</script>
