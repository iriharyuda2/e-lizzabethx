<input type="file" id="f" accept="image/*">
<textarea id="out" rows="6" readonly placeholder="Base64 appears here..."></textarea>
<h2>How to Use</h2><p>Choose an image to get its Base64 string.</p>
<script>document.getElementById('f').onchange=function(){const f=this.files[0];if(!f)return;const r=new FileReader();r.onload=function(){document.getElementById('out').value=r.result;};r.readAsDataURL(f);};</script>
