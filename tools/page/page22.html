<input type="text" id="in" placeholder="Type title...">
<button onclick="s()">Convert</button>
<div class="result" id="out">—</div>
<h2>What Is a Slug?</h2><p>A slug is the URL-friendly version of a title.</p>
<script>function s(){const v=document.getElementById('in').value.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-');document.getElementById('out').textContent=v;}</script>
