<label>Pick a color <input type="color" id="c" value="#0366d6"></label>
<div class="result" id="out">—</div>
<h2>How to Use</h2><p>Pick a color to see HEX, RGB, and HSL.</p>
<script>function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b};}function upd(){const h=document.getElementById('c').value;const {r,g,b}=hexToRgb(h);document.getElementById('out').textContent=`HEX: ${h} · RGB: ${r},${g},${b}`;}document.getElementById('c').oninput=upd;upd();</script>
