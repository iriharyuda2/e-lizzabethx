<textarea id="in" rows="6" placeholder="One name per line..."></textarea>
<button onclick="p()">Pick Random</button>
<div class="result" id="out">—</div>
<h2>How to Use</h2><p>Enter names (one per line), click Pick Random.</p>
<script>function p(){const l=document.getElementById('in').value.split('\n').filter(x=>x.trim());if(!l.length)return;document.getElementById('out').textContent=l[Math.floor(Math.random()*l.length)];}</script>
