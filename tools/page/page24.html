<label>HEX <input type="text" id="hex" value="#0366d6"></label>
<label>RGB <input type="text" id="rgb" placeholder="r,g,b"></label>
<button onclick="h2r()">HEX → RGB</button><button onclick="r2h()">RGB → HEX</button>
<div class="result" id="out">—</div>
<h2>How to Use</h2><p>Enter HEX or RGB and convert.</p>
<script>function h2r(){const h=document.getElementById('hex').value;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);document.getElementById('rgb').value=`${r},${g},${b}`;document.getElementById('out').textContent=`RGB: ${r},${g},${b}`;}function r2h(){const p=document.getElementById('rgb').value.split(',').map(x=>+x.trim());const h='#'+p.map(x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('hex').value=h;document.getElementById('out').textContent=`HEX: ${h}`;}</script>
