<input type="file" id="f" accept="image/*">
<label>Width <input type="number" id="w" min="1"></label>
<label>Height <input type="number" id="h" min="1"></label>
<button onclick="r()">Resize</button>
<canvas id="c" style="max-width:100%;margin-top:1rem;display:none"></canvas>
<p><a id="dl" style="display:none">Download resized</a></p>
<h2>How It Works</h2><p>Resizes image to your chosen dimensions via canvas.</p>
<script>let img;document.getElementById('f').onchange=function(){const f=this.files[0];if(!f)return;img=new Image();img.onload=function(){document.getElementById('w').value=img.width;document.getElementById('h').value=img.height;};img.src=URL.createObjectURL(f);};function r(){if(!img)return;const w=+document.getElementById('w').value;const h=+document.getElementById('h').value;const c=document.getElementById('c');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.style.display='block';c.toBlob(function(b){const a=document.getElementById('dl');a.href=URL.createObjectURL(b);a.download='resized.png';a.style.display='inline';});}</script>
