<textarea id="in" rows="8" placeholder='{"hello":"world"}'></textarea>
<p><button onclick="f(false)">Format</button><button onclick="f(true)">Minify</button></p>
<textarea id="out" rows="10" readonly></textarea>
<p id="err" style="color:#c00"></p>
<h2>What It Does</h2><p>Validates JSON and outputs pretty or minified.</p>
<script>function f(m){const e=document.getElementById('err');e.textContent='';try{const o=JSON.parse(document.getElementById('in').value);document.getElementById('out').value=m?JSON.stringify(o):JSON.stringify(o,null,2);}catch(x){e.textContent='Invalid JSON: '+x.message;}}</script>
