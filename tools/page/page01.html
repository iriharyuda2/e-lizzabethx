<p style="font-size:3rem;font-variant-numeric:tabular-nums" id="d">25:00</p>
<p><button onclick="start()">Start</button><button onclick="pause()">Pause</button><button onclick="reset()">Reset</button></p>
<h2>How It Works</h2><p>Work 25 minutes, break 5. Repeat 4 times, then long break.</p>
<script>let r=25*60,t=null;function render(){const m=String(Math.floor(r/60)).padStart(2,'0');const s=String(r%60).padStart(2,'0');document.getElementById('d').textContent=`${m}:${s}`;}function start(){if(t)return;t=setInterval(()=>{if(r<=0){pause();alert('Session done!');return;}r--;render();},1000);}function pause(){clearInterval(t);t=null;}function reset(){pause();r=25*60;render();}render();</script>
